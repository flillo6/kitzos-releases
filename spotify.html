<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kitz • Connessione Spotify</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      background: #1e293b;
      border: 2px solid #1ed760;
      box-shadow: 0 10px 25px rgba(30, 215, 96, 0.2);
      border-radius: 20px;
      padding: 30px 24px;
      max-width: 360px;
      width: 100%;
    }
    .icon { font-size: 48px; margin-bottom: 12px; }
    h2 { margin: 0 0 10px 0; color: #1ed760; font-size: 22px; }
    p { color: #94a3b8; font-size: 14px; line-height: 1.5; margin: 0 0 20px 0; }
    .loader {
      border: 3px solid rgba(255,255,255,0.1);
      border-top: 3px solid #1ed760;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px auto;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .btn {
      display: inline-block;
      background: #1ed760;
      color: #000;
      font-weight: 800;
      padding: 12px 24px;
      border-radius: 24px;
      text-decoration: none;
      font-size: 14px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🎧</div>
    <div class="loader" id="spinner"></div>
    <h2>Collegamento a Kitz...</h2>
    <p id="msg">Accesso Spotify riuscito! Reindirizzamento al tuo Kitz in corso...</p>
    <a href="#" id="manualBtn" class="btn" style="display:none;">TORNA A KITZ</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const error = params.get('error');

    if (error) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('msg').innerHTML = "Accesso annullato da Spotify.<br><br><a href='http://kitz.local/' class='btn'>Torna a Kitz</a>";
    } else if (code) {
      const targetUrl = "http://kitz.local/callback?code=" + encodeURIComponent(code);
      document.getElementById('manualBtn').href = targetUrl;
      document.getElementById('manualBtn').style.display = 'inline-block';
      
      // Reindirizzamento automatico immediato
      setTimeout(() => {
        window.location.href = targetUrl;
      }, 400);
    } else {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('msg').innerText = "Nessun codice di autorizzazione trovato.";
    }
  </script>
</body>
</html>
